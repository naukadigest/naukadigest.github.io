# Настройки сайта. Внутри сайта — несколько газет (editions), каждая по своему адресу:
#   <url>/<slug>/  — например https://naukadigest.github.io/ilnaz/
# Номера газеты лежат в content/<slug>/ГГГГ-ММ-ДД.md (формат — в README.md).
# Корневая страница сайта пустая.

# Адрес сайта без слеша в конце
url: https://naukadigest.github.io
# Свой домен (например naukadigest.ru). Пусто — используется адрес github.io
domain: ""
language: ru
# Номер счётчика Яндекс Метрики (только цифры). Пусто — Метрика не подключается
yandex_metrika_id: ""
# Контакт для вопросов по персональным данным (страница /privacy/)
contact_email: ""

# Метки статуса материала (общие для всех газет; белый текст на цветной плашке)
statuses:
  - name: Рецензируемая статья
    color: "#2e7d32"
  - name: Препринт
    color: "#ef6c00"
  - name: Официальный релиз
    color: "#1565c0"
  - name: Научная журналистика
    color: "#546e7a"
  - name: Сообщение агентства
    color: "#6d4c41"

editions:
  - slug: ilnaz
    name: Научный дайджест
    tagline: Утренняя газета о науке и технологиях
    description: Ежедневный обзор главного в науке и технологиях — ИИ, роботы, биология, космос, чипы, программирование и логистика. Только рецензируемые статьи, препринты с пометкой и официальные релизы.
    # Номер выпуска = количество дней с этой даты + 1 (10.10.2026 = №1)
    first_issue: 2026-10-10
    # Рубрики в порядке появления в номере. У новости в файле номера указывается slug.
    rubrics:
      - slug: ai
        name: Искусственный интеллект
        color: "#5b2c83"
      - slug: robots
        name: Роботы и воплощённый ИИ
        color: "#00695c"
      - slug: bio
        name: Нейробиология и биология
        color: "#ad1457"
      - slug: hitech
        name: Высокие технологии
        color: "#e65100"
      - slug: space
        name: Космос
        color: "#1a237e"
      - slug: code
        name: Программирование и компьютеры
        color: "#37474f"
      - slug: logistics
        name: Международная логистика
        color: "#4e342e"

  # ЗАГОТОВКА: темы, название и рубрики уточняются
  - slug: rustem
    name: Утренний дайджест
    tagline: Ежедневная газета
    description: Ежедневная подборка главных новостей. Только авторитетные источники.
    first_issue: 2026-10-25
    # Текст страницы «О газете» (Markdown). Если не задан — стандартный текст научного дайджеста
    about: |
      Ежедневная подборка главных новостей по выбранным темам. Первый номер скоро выйдет.
    rubrics:
      - slug: main
        name: Главное
        color: "#37474f"
