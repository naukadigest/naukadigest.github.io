# Настройки сайта «Научный дайджест»
name: Научный дайджест
tagline: Утренняя газета о науке и технологиях
description: Ежедневный обзор главного в науке и технологиях — ИИ, роботы, биология, космос, чипы, программирование и логистика. Только рецензируемые статьи, препринты с пометкой и официальные релизы.
# Адрес сайта без слеша в конце
url: https://naukadigest.github.io
# Свой домен (например naukadigest.ru). Пусто — используется адрес github.io
domain: ""
language: ru
# Номер выпуска = количество дней с этой даты + 1 (10.10.2026 = №1)
first_issue: 2026-10-10
# Номер счётчика Яндекс Метрики (только цифры). Пусто — Метрика не подключается
yandex_metrika_id: ""
# Контакт для вопросов по персональным данным (страница /privacy/)
contact_email: ""

# Рубрики в порядке появления в номере. В файле выпуска у новости указывается slug.
rubrics:
  - slug: ai
    name: Искусственный интеллект
    color: "#5b2c83"
  - slug: robots
    name: Роботы и воплощённый ИИ
    color: "#00695c"
  - slug: bio
    name: Нейробиология и биология
    color: "#ad1457"
  - slug: hitech
    name: Высокие технологии
    color: "#e65100"
  - slug: space
    name: Космос
    color: "#1a237e"
  - slug: code
    name: Программирование и компьютеры
    color: "#37474f"
  - slug: logistics
    name: Международная логистика
    color: "#4e342e"

# Метки статуса материала (белый текст на цветной плашке)
statuses:
  - name: Рецензируемая статья
    color: "#2e7d32"
  - name: Препринт
    color: "#ef6c00"
  - name: Официальный релиз
    color: "#1565c0"
